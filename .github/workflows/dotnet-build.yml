name: ASP.NET Core Build

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "bugfix/**"

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src/SyntechSoftwareWebApplication

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Display .NET Version
        run: dotnet --version

      - name: Restore NuGet Packages
        run: dotnet restore SyntechSoftwareWebApplication.slnx

      - name: Build Solution
        run: dotnet build SyntechSoftwareWebApplication.slnx --configuration Release --no-restore

      # Uncomment this part once the xUnit project has been created
      #
      # - name: Run Unit Tests
      #   run: dotnet test SyntechSoftwareWebApplication.slnx --configuration Release --no-build
